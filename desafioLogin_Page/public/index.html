<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Login</h1>
        <p class="sub">Entre para receber seu access_token.</p>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="admin@teste.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required>

            <button type="submit" id="btn">Entrar</button>
        </form>

        <p id="msg"></p>

        <div id="resultado" class="oculto">
            <label for="token">access_token</label>
            <textarea id="token" readonly></textarea>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
